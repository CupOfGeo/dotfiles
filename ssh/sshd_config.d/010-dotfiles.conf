# Server config for THIS machine. Source of truth lives in the dotfiles repo at
# ssh/sshd_config.d/010-dotfiles.conf; ssh/install.sh copies it (root-owned) to
# /etc/ssh/sshd_config.d/. Edit it here, then re-run the module installer --
# editing the copy in /etc will be overwritten.
#
# Named 010- so it sorts BEFORE the stock 100-macos.conf. OpenSSH keeps the
# FIRST value it obtains for a keyword, so sorting first is what makes these
# settings win rather than get ignored.
#
# The AllowUsers line is rewritten to the installing user by install.sh.

# --- Authentication ----------------------------------------------------------
# Keys only. Nothing here can be brute-forced with a password.
PubkeyAuthentication yes
AuthenticationMethods publickey
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
PermitRootLogin no

# Only this account may log in over SSH, regardless of who else exists.
# install.sh rewrites this placeholder to the installing user.
AllowUsers __INSTALL_USER__

# --- Exposure ----------------------------------------------------------------
# NO ListenAddress here, deliberately. macOS runs sshd under launchd socket
# activation (/System/Library/LaunchDaemons/ssh.plist owns the listening
# socket and spawns sshd with -i), so sshd never binds a socket itself and
# ListenAddress is silently ignored. Limiting which interface answers has to
# be done at the network layer -- see ssh/README.md.

# --- Hardening ---------------------------------------------------------------
MaxAuthTries 3
MaxSessions 10
LoginGraceTime 30
X11Forwarding no
# AllowAgentForwarding no
AllowTcpForwarding yes
PermitTunnel no
# PrintMotd no

# Drop sessions whose network has gone away (~10 min).
ClientAliveInterval 300
ClientAliveCountMax 2
