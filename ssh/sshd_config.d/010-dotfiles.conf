# Server config for THIS machine. Source of truth lives in the dotfiles repo at
# ssh/sshd_config.d/010-dotfiles.conf; ssh/install.sh copies it (root-owned) to
# /etc/ssh/sshd_config.d/. Edit it here, then re-run the module installer --
# editing the copy in /etc will be overwritten.
#
# Named 010- so it sorts BEFORE the stock 100-macos.conf. OpenSSH keeps the
# FIRST value it obtains for a keyword, so sorting first is what makes these
# settings win rather than get ignored.
#
# The AllowUsers line is rewritten to the installing user by install.sh.

# --- Authentication ----------------------------------------------------------
# Keys only. Nothing here can be brute-forced with a password.
PubkeyAuthentication yes
AuthenticationMethods publickey
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
PermitRootLogin no

# Only this account may log in over SSH, and only from the tailnet. sshd
# evaluates AllowUsers per connection, so unlike ListenAddress (ignored under
# launchd, see below) this IS honored, and unlike a pf rule on utunN it does not
# break across reboots. 100.64.0.0/10 is the CGNAT range Tailscale assigns for
# IPv4; fd7a:115c:a1e0::/48 is its IPv6 ULA. A connection from the LAN or a
# public network is refused no matter which key it presents.
# install.sh rewrites the placeholder to the installing user.
AllowUsers __INSTALL_USER__@100.64.0.0/10 __INSTALL_USER__@fd7a:115c:a1e0::/48

# --- Exposure ----------------------------------------------------------------
# NO ListenAddress here, deliberately. macOS runs sshd under launchd socket
# activation (/System/Library/LaunchDaemons/ssh.plist owns the listening
# socket and spawns sshd with -i), so sshd never binds a socket itself and
# ListenAddress is silently ignored. The tailnet-only restriction lives on the
# AllowUsers line above instead; see ssh/README.md.

# --- Hardening ---------------------------------------------------------------
MaxAuthTries 3
MaxSessions 10
LoginGraceTime 30
X11Forwarding no
# AllowAgentForwarding no
AllowTcpForwarding yes
PermitTunnel no
# PrintMotd no

# Drop sessions whose network has gone away (~10 min).
ClientAliveInterval 300
ClientAliveCountMax 2
