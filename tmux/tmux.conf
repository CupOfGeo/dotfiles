# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'erikw/tmux-powerline'

# let me scroll
set -g mouse on

# Start window/pane numbering at 1 (easier to reach than 0 on most keyboards).
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Forward modified keys (Shift+Enter, etc.) through to inner apps like Claude Code.
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Forward the pane title (e.g. Claude Code's chat title) to iTerm so the tab isn't just "tmux".
set -g set-titles on
set -g set-titles-string '#T'

# Let inner programs send escapes straight to iTerm (used by iterm/ssh-color.sh).
set -g allow-passthrough on

# Initialize TMUX plugin manager (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
